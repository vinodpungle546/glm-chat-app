<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload recording</title>
<style>
  :root { --bg:#0e1117; --panel:#1b2130; --text:#f0f2f6; --muted:#8b93a5; --accent:#4da6ff; --ok:#3ecf8e; --err:#ff6b6b; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  .drop { border:1.5px dashed #3d4657; border-radius:10px; background:var(--panel); padding:14px; text-align:center; cursor:pointer; }
  .drop.over { border-color:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  progress { width:100%; height:10px; accent-color:var(--accent); margin-top:8px; }
  #status { margin-top:6px; min-height:18px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  input[type=file] { display:none; }
</style>
</head>
<body>
<label class="drop" id="drop">
  <input type="file" id="file" accept=".mp4,.m4a,.mov,.mkv,.webm,.wav,.mp3,.aac,.flac,.ogg,.m4v">
  <div>🎙️ <b>Drop a meeting recording here</b> or click to choose</div>
  <div class="muted">Any size · stays on this Mac · resumes if interrupted</div>
</label>
<progress id="bar" value="0" max="1" hidden></progress>
<div id="status" class="muted"></div>
<script>
const drop = document.getElementById("drop"), input = document.getElementById("file");
const bar = document.getElementById("bar"), status = document.getElementById("status");
const say = (msg, cls = "muted") => { status.className = cls; status.textContent = msg; };
const fmt = b => b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB";

drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
input.addEventListener("change", () => input.files[0] && upload(input.files[0]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch (_) {} throw new Error(d || r.statusText); }
  return r.json();
}

async function upload(file) {
  bar.hidden = false; bar.value = 0;
  try {
    const init = await api("/uploads/init", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: file.name, size: file.size }) });
    const size = init.chunk_size, total = Math.ceil(file.size / size), have = new Set(init.received);
    if (have.size) say(`Resuming: ${have.size}/${total} parts already uploaded`);
    const t0 = Date.now(); let sent = 0;
    for (let n = 0; n < total; n++) {
      if (!have.has(n)) {
        for (let attempt = 1; ; attempt++) {
          try {
            await api(`/uploads/${init.upload_id}/chunk/${n}`, { method: "PUT", body: file.slice(n * size, (n + 1) * size) });
            break;
          } catch (err) {
            if (attempt >= 5) throw err;
            say(`Network hiccup, retrying part ${n + 1} (${attempt}/5)…`);
            await new Promise(res => setTimeout(res, 1000 * attempt));
          }
        }
        sent += Math.min(size, file.size - n * size);
      }
      bar.value = (n + 1) / total;
      const rate = sent / Math.max(1, (Date.now() - t0) / 1000);
      const left = (file.size - (n + 1) * size) / Math.max(rate, 1);
      say(`Uploading ${file.name}: ${fmt(Math.min(file.size, (n + 1) * size))} / ${fmt(file.size)}` +
          (rate > 0 && left > 0 ? ` · ~${Math.ceil(left / 60)} min left` : ""));
    }
    const done = await api(`/uploads/${init.upload_id}/complete`, { method: "POST" });
    say(`✓ Uploaded ${done.name}. It is selected below: choose the speakers and press “Start transcription”.`, "ok");
  } catch (err) {
    say(`✗ ${err.message}. Choose the same file again to resume.`, "err");
  }
}
</script>
</body>
</html>
